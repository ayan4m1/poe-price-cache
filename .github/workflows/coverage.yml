name: Upload coverage on push
on:
  push:
    branches: ['main']
permissions:
  id-token: write
jobs:
  cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - run: yarn install --immutable
      - run: yarn run test
      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage.lcov
          use_oidc: true
